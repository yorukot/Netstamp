name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - ".github/workflows/docker.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "deployments/Dockerfile"
      - "deployments/compose.yaml"
      - "deployments/.env.example"
      - "deployments/dev/**"
      - "packages/**"
      - "server/**"
      - "web/**"
  pull_request:
    paths:
      - ".github/workflows/docker.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "deployments/Dockerfile"
      - "deployments/compose.yaml"
      - "deployments/.env.example"
      - "deployments/dev/**"
      - "packages/**"
      - "server/**"
      - "web/**"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Docker image for the selected ref
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  DOCKER_IMAGE: yorukot/netstamp

jobs:
  ValidateCompose:
    name: Validate Compose files
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_URL: https://netstamp.example.com
      DATABASE_PASSWORD: 0123456789abcdef0123456789abcdef
      LOG_PSEUDONYM_KEY: 123456789abcdef0123456789abcdef0
      SYSTEM_SETTINGS_ENCRYPTION_KEY: 23456789abcdef0123456789abcdef01
      AUTH_SESSION_HASH_KEY: 3456789abcdef0123456789abcdef012
      AUTH_API_TOKEN_HASH_KEY: 456789abcdef0123456789abcdef0123
      POSTGRES_EXPORTER_PASSWORD: 56789abcdef0123456789abcdef01234
      GF_SECURITY_ADMIN_PASSWORD: 6789abcdef0123456789abcdef012345
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Validate production Compose
        run: docker compose -f deployments/compose.yaml config --quiet

      - name: Validate development Compose
        run: docker compose -f deployments/dev/compose.yaml config --quiet

  ValidateNginx:
    name: Build development nginx image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/dev/nginx.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  Publish:
    name: Build Docker image
    needs: ValidateCompose
    runs-on: ubuntu-latest
    env:
      PUBLISH_IMAGE: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || inputs.publish }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Go for release version validation
        if: github.ref_type == 'tag'
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod

      - name: Validate release tag
        if: github.ref_type == 'tag'
        working-directory: server
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PRODUCT_VERSION=$(go run ./cmd/agent --version)
          test "$RELEASE_TAG" = "v$PRODUCT_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile
          platforms: ${{ env.PUBLISH_IMAGE == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ReleaseAssets:
    name: Publish self-host release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [Publish, ValidateCompose]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Package deployment files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "release/netstamp-${RELEASE_TAG}"
          cp deployments/compose.yaml "release/netstamp-${RELEASE_TAG}/compose.yaml"
          sed -i "s/NETSTAMP_VERSION:-latest/NETSTAMP_VERSION:-${RELEASE_TAG}/g" "release/netstamp-${RELEASE_TAG}/compose.yaml"
          cp deployments/.env.example "release/netstamp-${RELEASE_TAG}/.env.example"
          cp "release/netstamp-${RELEASE_TAG}/compose.yaml" release/compose.yaml
          cp "release/netstamp-${RELEASE_TAG}/.env.example" release/.env.example
          tar -C release -czf "release/netstamp-${RELEASE_TAG}.tar.gz" "netstamp-${RELEASE_TAG}"
          cd release
          sha256sum compose.yaml .env.example "netstamp-${RELEASE_TAG}.tar.gz" > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || gh release create "${RELEASE_TAG}" --generate-notes --verify-tag
          gh release upload "${RELEASE_TAG}" \
            release/compose.yaml \
            release/.env.example \
            "release/netstamp-${RELEASE_TAG}.tar.gz" \
            release/SHA256SUMS \
            --clobber
