name: Docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yaml"
      - ".prettierrc"
      - "docs/**"
      - "packages/brand/**"
      - "packages/i18n/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PUBLIC_NETSTAMP_UMAMI_WEBSITE_ID: ${{ vars.NETSTAMP_UMAMI_WEBSITE_ID }}
  PUBLIC_NETSTAMP_UMAMI_SCRIPT_URL: ${{ vars.NETSTAMP_UMAMI_SCRIPT_URL || 'https://cloud.umami.is/script.js' }}
  PUBLIC_NETSTAMP_TRACKING_CONSENT_MODE: ${{ vars.NETSTAMP_TRACKING_CONSENT_MODE || 'regional' }}
  PUBLIC_NETSTAMP_TRACKING_CONSENT_COUNTRIES: ${{ vars.NETSTAMP_TRACKING_CONSENT_COUNTRIES }}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter @netstamp/docs build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
