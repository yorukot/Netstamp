name: Backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/backend.yaml"
      - ".prettierrc"
      - "api/**"
      - "docs/public/openapi.json"
      - "golangci.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "server/**"
      - "web/src/shared/api/openapi.d.ts"
  workflow_dispatch:

env:
  GOLANGCI_LINT_VERSION: v2.12.2

permissions:
  contents: read
  pull-requests: read

jobs:
  Changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflow == 'true' || steps.filter.outputs.prettier == 'true' || steps.filter.outputs.api == 'true' || steps.filter.outputs.openapi == 'true' || steps.filter.outputs.golangci == 'true' || steps.filter.outputs.package == 'true' || steps.filter.outputs.lock == 'true' || steps.filter.outputs.workspace == 'true' || steps.filter.outputs.server == 'true' || steps.filter.outputs.web_api == 'true' }}
      contract: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api == 'true' || steps.filter.outputs.openapi == 'true' || steps.filter.outputs.package == 'true' || steps.filter.outputs.lock == 'true' || steps.filter.outputs.workspace == 'true' || steps.filter.outputs.web_api == 'true' }}
    steps:
      - name: Checkout repo
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v6

      - name: Detect relevant changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            workflow:
              - ".github/workflows/backend.yaml"
            prettier:
              - ".prettierrc"
            api:
              - "api/**"
            openapi:
              - "docs/public/openapi.json"
            golangci:
              - "golangci.yaml"
            package:
              - "package.json"
            lock:
              - "pnpm-lock.yaml"
            workspace:
              - "pnpm-workspace.yaml"
            server:
              - "server/**"
            web_api:
              - "web/src/shared/api/openapi.d.ts"

  Format:
    name: Check backend formatting
    needs: Changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require change detection
        if: needs.Changes.result != 'success'
        run: exit 1

      - name: Skip backend formatting
        if: needs.Changes.outputs.relevant != 'true'
        run: echo "No backend-related changes; skipping backend formatting."

      - name: Checkout repo
        if: needs.Changes.outputs.relevant == 'true'
        uses: actions/checkout@v6

      - name: Setup Go
        if: needs.Changes.outputs.relevant == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install golangci-lint
        if: needs.Changes.outputs.relevant == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
          working-directory: server

      - name: Run backend formatters
        if: needs.Changes.outputs.relevant == 'true'
        run: cd server && golangci-lint fmt --config ../golangci.yaml

      - name: Check backend formatting diff
        if: needs.Changes.outputs.relevant == 'true'
        run: git diff --exit-code -- server

  Lint:
    name: Run lint
    needs: Changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require change detection
        if: needs.Changes.result != 'success'
        run: exit 1

      - name: Skip backend lint
        if: needs.Changes.outputs.relevant != 'true'
        run: echo "No backend-related changes; skipping backend lint."

      - name: Checkout repo
        if: needs.Changes.outputs.relevant == 'true'
        uses: actions/checkout@v6

      - name: Setup Go
        if: needs.Changes.outputs.relevant == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install golangci-lint
        if: needs.Changes.outputs.relevant == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
          working-directory: server

      - name: Run backend lint
        if: needs.Changes.outputs.relevant == 'true'
        working-directory: server
        run: golangci-lint run --config ../golangci.yaml ./...

  Test:
    name: Run tests
    needs: Changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require change detection
        if: needs.Changes.result != 'success'
        run: exit 1

      - name: Skip backend tests
        if: needs.Changes.outputs.relevant != 'true'
        run: echo "No backend-related changes; skipping backend tests."

      - name: Checkout repo
        if: needs.Changes.outputs.relevant == 'true'
        uses: actions/checkout@v6

      - name: Setup Go
        if: needs.Changes.outputs.relevant == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run backend tests
        if: needs.Changes.outputs.relevant == 'true'
        run: cd server && go test ./...

  OpenAPI:
    name: Check generated OpenAPI artifacts
    needs: Changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require change detection
        if: needs.Changes.result != 'success'
        run: exit 1

      - name: Skip generated OpenAPI check
        if: needs.Changes.outputs.contract != 'true'
        run: echo "No backend-related changes; skipping generated OpenAPI checks."

      - name: Checkout repo
        if: needs.Changes.outputs.contract == 'true'
        uses: actions/checkout@v6

      - name: Setup pnpm
        if: needs.Changes.outputs.contract == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: needs.Changes.outputs.contract == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: "pnpm"

      - name: Install dependencies
        if: needs.Changes.outputs.contract == 'true'
        run: pnpm install --frozen-lockfile

      - name: Regenerate OpenAPI artifacts
        if: needs.Changes.outputs.contract == 'true'
        run: pnpm generate:openapi

      - name: Check generated OpenAPI artifacts
        if: needs.Changes.outputs.contract == 'true'
        run: git diff --exit-code -- docs/public/openapi.json server/internal/controller/transport/http/openapi/openapi.json web/src/shared/api/openapi.d.ts web/src/shared/api/metadata.generated.ts
