<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 800" role="img" aria-labelledby="title description">
	<title id="title">How Netstamp turns configuration into evidence</title>
	<description id="description">
		Within a project, probe labels and check selectors create assignments. Probes execute those assignments and return results. Results support Insight, alert rules and notifications, and status pages.
	</description>
	<defs>
		<filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
			<feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111827" flood-opacity="0.08" />
		</filter>
		<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
			<path d="M0 0L10 5L0 10Z" fill="#667085" />
		</marker>
		<marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
			<path d="M0 0L10 5L0 10Z" fill="#f17012" />
		</marker>
		<style>
			.canvas { fill: #f7f8fa; }
			.card { fill: #fff; stroke: #d6dbe3; stroke-width: 2; filter: url(#shadow); }
			.assignment { fill: #fff7f1; stroke: #f17012; stroke-width: 2; filter: url(#shadow); }
			.result { fill: #171d29; stroke: #171d29; stroke-width: 2; filter: url(#shadow); }
			.badge { fill: #fff0e4; }
			.badge-text { fill: #b54708; font: 700 13px ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.2px; }
			.title { fill: #151b2b; font: 700 36px ui-sans-serif, system-ui, sans-serif; }
			.subtitle { fill: #667085; font: 500 18px ui-sans-serif, system-ui, sans-serif; }
			.column { fill: #667085; font: 700 14px ui-sans-serif, system-ui, sans-serif; letter-spacing: 2px; }
			.card-title { fill: #151b2b; font: 700 27px ui-sans-serif, system-ui, sans-serif; }
			.card-copy { fill: #667085; font: 500 17px ui-sans-serif, system-ui, sans-serif; }
			.result-title { fill: #fff; font: 700 27px ui-sans-serif, system-ui, sans-serif; }
			.result-copy { fill: #c9d0dc; font: 500 17px ui-sans-serif, system-ui, sans-serif; }
			.outcome-title { fill: #151b2b; font: 700 21px ui-sans-serif, system-ui, sans-serif; }
			.outcome-copy { fill: #667085; font: 500 15px ui-sans-serif, system-ui, sans-serif; }
			.connector-label { fill: #b54708; font: 700 14px ui-monospace, SFMono-Regular, monospace; }
			.line { fill: none; stroke: #667085; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
			.arrow { marker-end: url(#arrow); }
			.notification-line { fill: none; stroke: #f17012; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow-orange); }
			.divider { stroke: #dfe3e9; stroke-width: 2; }
			.dot { fill: #f17012; }
		</style>
	</defs>

	<rect width="1680" height="800" class="canvas" />

	<rect x="72" y="62" width="148" height="34" rx="17" class="badge" />
	<text x="146" y="84" text-anchor="middle" class="badge-text">ONE PROJECT</text>
	<text x="72" y="142" class="title">Configuration becomes evidence.</text>
	<text x="72" y="180" class="subtitle">Define what to observe, run it from the right networks, and use every returned measurement.</text>
	<line x1="72" y1="216" x2="1608" y2="216" class="divider" />

	<text x="72" y="262" class="column">CONFIGURATION</text>
	<text x="490" y="262" class="column">EXECUTION</text>
	<text x="1270" y="262" class="column">OUTCOMES</text>

	<path d="M372 358H416C444 358 444 423 470 423H490" class="line arrow" />
	<path d="M372 584H416C444 584 444 497 470 497H490" class="line arrow" />
	<text x="406" y="340" class="connector-label">labels</text>
	<text x="394" y="613" class="connector-label">selectors</text>

	<path d="M790 460H882" class="line arrow" />
	<text x="826" y="443" class="connector-label">execute</text>

	<path d="M1162 460H1208M1208 326V694" class="line" />
	<path d="M1208 326H1270" class="line arrow" />
	<path d="M1208 446H1270" class="line arrow" />
	<path d="M1208 686H1270" class="line arrow" />
	<path d="M1422 490V526" class="notification-line" />

	<rect x="72" y="294" width="300" height="128" rx="14" class="card" />
	<circle cx="112" cy="334" r="8" class="dot" />
	<text x="138" y="345" class="card-title">Probes</text>
	<text x="112" y="383" class="card-copy">Agents in the networks you observe</text>

	<rect x="72" y="520" width="300" height="128" rx="14" class="card" />
	<circle cx="112" cy="560" r="8" class="dot" />
	<text x="138" y="571" class="card-title">Checks</text>
	<text x="112" y="609" class="card-copy">Targets, schedules, and selectors</text>

	<rect x="490" y="372" width="300" height="176" rx="14" class="assignment" />
	<text x="530" y="420" class="card-title">Assignments</text>
	<text x="530" y="458" class="card-copy">The probe–check pairs</text>
	<text x="530" y="486" class="card-copy">that Netstamp will execute</text>
	<rect x="530" y="510" width="74" height="6" rx="3" class="dot" />

	<rect x="882" y="372" width="280" height="176" rx="14" class="result" />
	<text x="922" y="420" class="result-title">Results</text>
	<text x="922" y="458" class="result-copy">Measurements returned</text>
	<text x="922" y="486" class="result-copy">independently by each probe</text>
	<rect x="922" y="510" width="74" height="6" rx="3" class="dot" />

	<rect x="1270" y="282" width="304" height="88" rx="14" class="card" />
	<circle cx="1306" cy="326" r="7" class="dot" />
	<text x="1330" y="321" class="outcome-title">Insight</text>
	<text x="1330" y="346" class="outcome-copy">Investigate and compare</text>

	<rect x="1270" y="402" width="304" height="88" rx="14" class="card" />
	<circle cx="1306" cy="446" r="7" class="dot" />
	<text x="1330" y="441" class="outcome-title">Alert rules</text>
	<text x="1330" y="466" class="outcome-copy">Detect unhealthy conditions</text>

	<rect x="1270" y="526" width="304" height="88" rx="14" class="card" />
	<circle cx="1306" cy="570" r="7" class="dot" />
	<text x="1330" y="565" class="outcome-title">Notifications</text>
	<text x="1330" y="590" class="outcome-copy">Deliver incident updates</text>

	<rect x="1270" y="642" width="304" height="88" rx="14" class="card" />
	<circle cx="1306" cy="686" r="7" class="dot" />
	<text x="1330" y="681" class="outcome-title">Status pages</text>
	<text x="1330" y="706" class="outcome-copy">Publish selected health</text>
</svg>
